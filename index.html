    case 'settings':
      var sf={ coinCap:fd.get('coinCap'), boostCap:fd.get('boostCap') };
      TIERS.forEach(function(t){ sf[t.id]=fd.get(t.id); sf['coin_'+t.id]=fd.get('coin_'+t.id); });
      updateSettings(sf);
      break;
  }
}
function onChange(e){
  if(e.target && e.target.id==='cal-ended'){ if(e.target.value){ ui.calSel=e.target.value; render(); } return; }
  if(e.target && e.target.id==='import-file-input' && e.target.files && e.target.files[0]){
    var reader=new FileReader();
    reader.onload=function(evt){
      try{
        var parsed=JSON.parse(evt.target.result);
        if(!parsed || typeof parsed!=='object' || !('habits' in parsed)){
          queueToast('That file doesn\'t look like an Ascend backup'); render(); return;
        }
        ui.pendingImportData=parsed;
        ui.showImportConfirm=true;
        render();
      }catch(err){ queueToast('Could not read that file'); render(); }
    };
    reader.readAsText(e.target.files[0]);
  }
}

/* =====================================================================
   INIT — a watchdog guarantees the app renders within a few seconds no
   matter what happens with storage detection, so it can never get stuck
   on the loading screen.
   ===================================================================== */
var appRendered=false;
var listenersAttached=false;
function attachListenersOnce(){
  if(listenersAttached) return;
  listenersAttached=true;
  document.addEventListener('click',onClick);
  document.addEventListener('submit',onSubmit);
  document.addEventListener('change',onChange);
  window.addEventListener('hashchange',render);
  setInterval(function(){ var p=state&&state.settings&&state.settings.pending; if(p && pendingDue() && !ui.pendingPromptDismissed && !document.querySelector('.overlay')) render(); },30000);
  setInterval(checkDayRollover,20000);
  document.addEventListener('keydown',function(e){ var t=e.target; if(t && t.classList && t.classList.contains('pe-name') && e.key==='Enter'){ e.preventDefault(); draftAddSibling(t.getAttribute('data-pid')); } });
  window.addEventListener('focus',function(){ checkDayRollover(); applyWidgetQueue(); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ checkDayRollover(); applyWidgetQueue(); } if(document.hidden && ui.activeTab==='settings' && ui.settingsUnlocked){ lockSettings(); ui.activeTab='today'; render(); }
    else if(!document.hidden && state && state.settings.pending && pendingDue()){ ui.pendingPromptDismissed=false; render(); } });
}
function finishInit(loaded,warn){
  state=normalizeState(loaded||defaultState());
  checkNewDay();
  checkAchievements();
  if(warn) ui.toast='Started a fresh session — reload if you expected saved progress';
  persist();
  render();
  attachListenersOnce();
  if(state.pcLedger.activeTimer) startTimerTick();
  applyWidgetQueue();
  try{ localStorage.setItem('ota_fail','0'); }catch(e){}
  try{
    var NB2=nativePlugin('WidgetBridge');
    if(NB2 && typeof NB2.addListener==='function') NB2.addListener('widgetTap',function(){ applyWidgetQueue(); });
  }catch(e){}
  var otaNotice=function(){ queueToast('Update downloaded \u2014 it applies next time you open the app'); render(); };
  window.addEventListener('ota-ready',otaNotice);
  if(window.__ota_ready) otaNotice();
  if(warn){
    if(toastTimeoutHandle) clearTimeout(toastTimeoutHandle);
    toastTimeoutHandle=setTimeout(function(){ ui.toast=null; render(); },5000);
  }
}
function init(){
  var watchdog=setTimeout(function(){
    if(!appRendered){
      console.error('Ascend: init did not complete in time, starting a fresh in-memory session');
      finishInit(null,true);
    }
  },4000);
  loadState().then(function(loaded){
    clearTimeout(watchdog);
    if(!appRendered) finishInit(loaded,false);
  }).catch(function(e){
    clearTimeout(watchdog);
    if(!appRendered){
      console.error('Ascend: load failed, starting fresh', e);
      finishInit(null,true);
    }
  });
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
} else {
  init();
}

/* expose for automated testing harness only (no-op in normal use) */
window.__ascendTestHooks={ getState:function(){return state;}, getUi:function(){return ui;}, getStorageMode:function(){return storageMode;} };

})();
</script>
<script>
/* Registers the service worker when this file is served from a real
   web origin (e.g. GitHub Pages). Harmless no-op anywhere else — it's
   wrapped in a try/catch so it never breaks the app if the browser or
   environment doesn't support it (like inside a chat preview). */
(function(){
  if(window.__OTA_SKIP) return;
  var isNative=false; try{ isNative=!!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }catch(e){}
  if('serviceWorker' in navigator && !isNative){
    window.addEventListener('load', function(){
      try{
        navigator.serviceWorker.register('service-worker.js').catch(function(){ /* not on a supported origin — ignore */ });
      }catch(e){ /* ignore */ }
    });
  }
})();
</script>
