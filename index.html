<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="app-version" content="6">
<script>
/* Self-update (Android app only). The app checks the website copy of this file in the background.
   When its app-version number is higher, it keeps the new copy and uses it from the next launch.
   If a downloaded version fails to start twice in a row, it is dropped and the built-in one is used. */
(function(){
  try{
    window.__OTA_SKIP=false;
    var C=window.Capacitor;
    var native=!!(C && ((C.isNativePlatform && C.isNativePlatform()) || (C.getPlatform && C.getPlatform()==='android')));
    if(!native) return;
    var U='__UPDATE_URL__';
    var TOKEN='__UPDATE'+'_URL__';
    var V=parseInt((document.querySelector('meta[name="app-version"]')||{}).content,10)||0;
    var ls=window.localStorage;
    var cached=ls.getItem('ota_html'), cv=parseInt(ls.getItem('ota_ver')||'0',10)||0;
    var fails=parseInt(ls.getItem('ota_fail')||'0',10)||0;
    var bad=parseInt(ls.getItem('ota_bad')||'0',10)||0;
    if(fails>=2){ if(cv>bad){ bad=cv; ls.setItem('ota_bad',String(bad)); } ls.removeItem('ota_html'); ls.removeItem('ota_ver'); ls.setItem('ota_fail','0'); cached=null; cv=0; fails=0; }
    if(cached && cv>V){
      /* keep the built-in app idle, then swap in the downloaded copy once this page has loaded */
      window.__OTA_SKIP=true;
      document.addEventListener('DOMContentLoaded',function(){ document.open(); document.write(cached); document.close(); });
      return;
    }
    ls.setItem('ota_fail',String(fails+1));
    if(U.indexOf('http')!==0) return;
    var running=V;
    function check(){
      return fetch(U+(U.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'})
        .then(function(r){ if(!r.ok) throw 0; return r.text(); })
        .then(function(t){
          var m=t.match(/name="app-version" content="(\d+)"/); var rv=m?parseInt(m[1],10):0;
          var have=Math.max(V,cv,bad,window.__ota_ready||0);
          if(rv>have){
            if(t.indexOf('</html>')>0 && t.indexOf('</scr'+'ipt>')>0){
              ls.setItem('ota_html',t.split(TOKEN).join(U)); ls.setItem('ota_ver',String(rv));
              window.__ota_ready=rv; window.dispatchEvent(new Event('ota-ready'));
              return { status:'ready', version:rv };
            }
            return { status:'error' };
          }
          return { status:window.__ota_ready?'ready':'current', version:window.__ota_ready||running };
        });
    }
    window.__ascendUpdate={ url:U, check:check };
    setTimeout(function(){ check().catch(function(){}); },2500);
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ascend — Habit Quest</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12160F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#12160F;
    --surface:#1B2117;
    --surface-2:#212A1B;
    --surface-3:#28321F;
    --border:#2E3626;
    --border-soft:#242C1D;
    --text:#EDE8DC;
    --text-muted:#9A9C8E;
    --text-faint:#6B6F5F;
    --gold:#C9A227;
    --gold-soft:#E0C468;
    --sage:#7FA872;
    --sage-soft:#A8CC9C;
    --peri:#8E97C9;
    --peri-soft:#B0B7DE;
    --brick:#B3524B;
    --brick-soft:#D07A73;
    --font-display:Georgia,'Iowan Old Style','Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,'SF Mono','Roboto Mono',Consolas,monospace;
    --radius:10px;
    --radius-lg:16px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:720px;margin:0 auto;padding:20px 16px 80px;}
  #loading{padding:60px 20px;text-align:center;color:var(--text-muted);font-family:var(--font-display);font-size:18px;}
  a{color:var(--gold-soft);}
  button{font-family:inherit;}
  ::selection{background:var(--gold);color:#1a1a12;}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
  }

  /* ===== Header / HUD ===== */
  .hud{
    background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px 20px;
    margin-bottom:18px;
  }
  .hud-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .wordmark{font-family:var(--font-display);font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:400;}
  .icon-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
    border-radius:8px;padding:6px 10px;font-size:12px;letter-spacing:0.04em;cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  .icon-btn:hover{border-color:var(--gold);color:var(--gold-soft);}
  .hud-main{display:flex;gap:16px;align-items:center;}
  .glyph-wrap{
    width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--bg);border:1px solid var(--border);border-radius:50%;
  }
  .glyph-wrap svg{width:40px;height:40px;filter:drop-shadow(0 0 6px rgba(201,162,39,.35));}
  .hud-info{flex:1;min-width:0;}
  .level-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .level-num{font-family:var(--font-display);font-size:22px;color:var(--text);}
  .level-tier{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;}
  .xp-bar-track{background:var(--bg);border:1px solid var(--border);border-radius:99px;height:8px;overflow:hidden;}
  .xp-bar-fill{background:linear-gradient(90deg,var(--gold) 0%,var(--gold-soft) 100%);height:100%;border-radius:99px;transition:width .5s ease;}
  .xp-label{font-size:11px;color:var(--text-faint);margin-top:4px;font-variant-numeric:tabular-nums;}
  .hud-stats{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-soft);flex-wrap:wrap;}
  .hud-stat{display:flex;flex-direction:column;gap:2px;}
  .hud-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);}
  .hud-stat-val{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums;}
  .c-gold{color:var(--gold-soft);}
  .c-sage{color:var(--sage-soft);}
  .c-peri{color:var(--peri-soft);}
  .c-brick{color:var(--brick-soft);}

  /* ===== Tabs ===== */
  .tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:18px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    background:transparent;border:none;color:var(--text-muted);padding:10px 12px;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--gold-soft);border-bottom-color:var(--gold);}
  .tab-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--gold-soft);outline-offset:2px;
  }

  /* ===== Cards / ledger entries ===== */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;
  }
  .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);margin-bottom:6px;display:block;}
  .section-title{font-family:var(--font-display);font-size:19px;margin:0 0 12px;color:var(--text);}
  .row{display:flex;align-items:center;gap:10px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .muted{color:var(--text-muted);}
  .faint{color:var(--text-faint);font-size:12.5px;}
  .empty{padding:22px 10px;text-align:center;color:var(--text-faint);font-size:13.5px;border:1px dashed var(--border);border-radius:var(--radius);}

  /* buttons */
  .btn{
    font-size:13px;padding:9px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);cursor:pointer;transition:all .15s;
  }
  .btn:hover{border-color:var(--text-muted);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--gold);border-color:var(--gold);color:#1a1608;font-weight:600;}
  .btn-primary:hover{background:var(--gold-soft);border-color:var(--gold-soft);}
  .btn-sage{background:var(--sage);border-color:var(--sage);color:#0f1a10;font-weight:600;}
  .btn-sage:hover{background:var(--sage-soft);}
  .btn-peri{background:var(--peri);border-color:var(--peri);color:#12142a;font-weight:600;}
  .btn-brick{background:var(--brick);border-color:var(--brick);color:#fff;}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:5px 10px;font-size:11.5px;}
  .btn-block{width:100%;}
  .btn-danger-outline{background:transparent;border-color:var(--brick);color:var(--brick-soft);}

  /* forms */
  label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:5px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;
  }
  input::placeholder,textarea::placeholder{color:var(--text-faint);}
  .field{margin-bottom:12px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  fieldset{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:0 0 12px;}
  legend{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);padding:0 6px;}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg label{margin:0;flex:1;text-align:center;padding:8px 6px;font-size:12px;text-transform:none;letter-spacing:0;cursor:pointer;color:var(--text-muted);border-right:1px solid var(--border);}
  .seg label:last-child{border-right:none;}
  .seg input{position:absolute;opacity:0;pointer-events:none;}
  .seg input:checked + label{background:var(--surface-3);color:var(--gold-soft);}

  /* habit row */
  .habit-item{border-top:1px solid var(--border-soft);padding:12px 0;}
  .habit-item:first-child{border-top:none;padding-top:0;}
  .habit-name-btn{background:none;border:none;color:var(--text);font-size:14.5px;text-align:left;cursor:pointer;padding:0;font-family:inherit;}
  .habit-name-btn:hover{color:var(--gold-soft);}
  .habit-meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .check-circle{
    width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--border);
    background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:transparent;transition:all .15s;
  }
  .check-circle.done{background:var(--sage);border-color:var(--sage);color:#0f1a10;}
  .check-circle svg{width:15px;height:15px;}
  .diff-tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;border:1px solid var(--border);}
  .diff-easy{color:var(--sage-soft);}
  .diff-medium{color:var(--gold-soft);}
  .diff-hard{color:var(--brick-soft);}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:9.5px;text-align:center;color:var(--text-faint);text-transform:uppercase;padding-bottom:2px;}
  .cal-cell{
    aspect-ratio:1;border-radius:6px;border:1px solid var(--border-soft);background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-faint);
    cursor:pointer;font-variant-numeric:tabular-nums;
  }
  .cal-cell.done{background:var(--sage);border-color:var(--sage);color:#0f1a10;font-weight:600;}
  .cal-cell.frozen{background:var(--peri);border-color:var(--peri);color:#12142a;}
  .cal-cell.future,.cal-cell.outside{opacity:.3;cursor:default;pointer-events:none;}
  .cal-cell.today-marker{box-shadow:0 0 0 1.5px var(--gold-soft) inset;}

  /* progress / meter bars */
  .meter{background:var(--bg);border:1px solid var(--border);border-radius:99px;height:10px;overflow:hidden;}
  .meter-fill{height:100%;border-radius:99px;transition:width .4s ease;}

  /* modal / overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,8,.72);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;}

  /* toast */
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface-3);
    border:1px solid var(--gold);border-radius:var(--radius);padding:12px 18px;z-index:60;
    display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    animation:toast-in .25s ease;max-width:90vw;
  }
  @keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

  /* misc */
  .divider{height:1px;background:var(--border-soft);margin:14px 0;}
  .list-plain{list-style:none;margin:0;padding:0;}
  .bar-chart{display:flex;align-items:flex-end;gap:8px;height:100px;padding-top:10px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar-shape{width:100%;max-width:26px;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;}
  .bar-col-label{font-size:9.5px;color:var(--text-faint);}
  .achv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
  .achv{border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;}
  .achv.locked{opacity:.35;}
  .achv-name{color:var(--gold-soft);font-weight:600;margin-bottom:2px;}
  textarea{resize:vertical;min-height:56px;}
  .recap-stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
  .recap-stat:last-child{border-bottom:none;}

  /* reorder controls */
  .reorder-col{display:flex;flex-direction:column;gap:2px;flex:none;}
  .reorder-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
    border-radius:5px;width:20px;height:16px;line-height:1;font-size:9px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .reorder-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-soft);}
  .reorder-btn:disabled{opacity:.25;cursor:default;}

  /* inline confirm */
  .confirm-inline{display:flex;align-items:center;gap:6px;font-size:12px;}
  .confirm-inline .muted{font-size:12px;}

  /* edit form panel */
  .edit-panel{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:10px;}

  /* level-up toast */
  .toast-levelup{
    border-color:var(--gold-soft);font-weight:600;color:var(--gold-soft);
    box-shadow:0 0 0 2px rgba(224,196,104,.3),0 8px 24px rgba(0,0,0,.45);
    animation:levelup-toast 1.8s ease-in-out;
  }
  @keyframes levelup-toast{
    0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(1);}
    12%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    28%{transform:translateX(-50%) scale(1.06);}
    42%{transform:translateX(-50%) scale(1);}
    58%{transform:translateX(-50%) scale(1.06);}
    72%{transform:translateX(-50%) scale(1);}
    100%{opacity:1;transform:translateX(-50%) scale(1);}
  }

  /* category tag + progress */
  .cat-tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;border:1px solid var(--border);}
  .cat-progress-row{margin-bottom:12px;}
  .cat-progress-row:last-child{margin-bottom:0;}
  .cat-progress-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
  .cat-progress-name{font-size:13px;font-weight:600;}
  .cat-progress-sub{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;}

  /* lifetime totals grid */
  .totals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
  .totals-cell{border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .totals-val{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--gold-soft);}
  .totals-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-top:2px;}

  .diff-tiny{color:var(--text-muted);} .diff-intense{color:#E0955C;} .diff-epic{color:var(--peri-soft);}
  .cog-btn{display:flex;align-items:center;justify-content:center;padding:6px;line-height:0;}
  .wheel-wrap{position:relative;width:150px;margin:6px auto 12px;}
  .wheel-wrap::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top:14px solid var(--text);z-index:2;}
  .wheel-wrap svg{width:100%;display:block;}
  .chal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  /* ===== v3 polish ===== */
  html{-webkit-tap-highlight-color:transparent;}
  button,.cal-cell,.seg label{touch-action:manipulation;}
  #app{max-width:760px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:calc(90px + env(safe-area-inset-bottom));}
  .tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:4px;margin-left:-4px;margin-right:-4px;padding-left:4px;padding-right:4px;}
  .tab-btn{padding:12px 13px;}
  .btn{min-height:38px;}
  .btn:active,.icon-btn:active,.check-circle:active{transform:scale(.96);}
  .btn-sm{min-height:30px;}
  .check-circle{width:36px;height:36px;}
  .check-circle svg{width:17px;height:17px;}
  .check-circle.rest{border-color:var(--peri);color:var(--peri);}
  .check-circle.rest svg{display:none;}
  .check-circle.rest::after{content:'z';font-family:var(--font-display);font-style:italic;font-size:15px;}
  .check-circle.pop{animation:pop .3s ease-out;}
  @keyframes pop{0%{transform:scale(.8);}60%{transform:scale(1.2);}100%{transform:scale(1);}}
  .fade{animation:fade-in .22s ease;}
  @keyframes fade-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .card{box-shadow:0 1px 0 rgba(255,255,255,.025) inset,0 6px 18px rgba(0,0,0,.18);}
  .coin{display:inline-block;width:.85em;height:.85em;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--gold) 70%);box-shadow:0 0 0 1.5px rgba(0,0,0,.25) inset;margin-right:5px;vertical-align:-1px;}
  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--text-muted);}
  .chip-gold{color:var(--gold-soft);border-color:rgba(201,162,39,.45);}
  .chip-peri{color:var(--peri-soft);border-color:rgba(142,151,201,.45);}
  .day-meter{margin:-2px 0 14px;}
  .overdue{color:var(--brick-soft);}
  .hud-stats{justify-content:space-between;}
  .link-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .spend-row{display:flex;gap:10px;align-items:flex-end;}
  .spend-row .field{flex:1;margin-bottom:0;}
  .big-num{font-family:var(--font-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;}
  .chal-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}

  /* ===== v4 polish ===== */
  body{background:radial-gradient(900px 420px at 50% -120px,rgba(201,162,39,.13),transparent 70%),var(--bg);background-attachment:fixed;}
  .hud{background:linear-gradient(160deg,var(--surface-2) 0%,var(--surface) 70%);border-color:rgba(201,162,39,.28);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03) inset,0 -40px 60px -50px rgba(201,162,39,.25) inset;}
  .xp-bar-fill{box-shadow:0 0 12px rgba(224,196,104,.55);}
  .card{border-radius:14px;background:linear-gradient(180deg,var(--surface) 0%,#181e14 100%);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 2px 4px rgba(0,0,0,.25),0 12px 28px rgba(0,0,0,.3);}

/* =====================================================================
   DATE UTILITIES (local time, avoids UTC off-by-one bugs)
   ===================================================================== */
function pad2(n){ return (n<10?'0':'')+n; }
function localDateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseDateKey(key){ var p=key.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
/* The app's "day" is not the calendar day. It switches at a cut-off hour (default 05:00), or earlier when you
   press "End day" during the last 12 hours of the day, so a day is never longer than 36 hours and never leaves a gap. */
var DAY_MAX_MS=36*3600*1000, DAY_END_EARLY_MS=12*3600*1000;
function dayHour(){
  var h=(typeof state!=='undefined' && state && state.settings)?parseInt(state.settings.dayStartHour,10):NaN;
  return (h>=0 && h<=12)?h:5;
}
function naturalDayKey(nowMs,H){ return localDateKey(new Date(nowMs-H*3600000)); }
function dayBoundaryMs(key,H){ var d=parseDateKey(key); return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,H,0,0,0).getTime(); }
function ensureDay(){
  if(typeof state==='undefined' || !state) return false;
  var now=Date.now(), H=dayHour(), d=state.day;
  if(!d || typeof d.key!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(d.key) || typeof d.startedAt!=='number'){
    state.day={ key:naturalDayKey(now,H), startedAt:now };
    return true;
  }
  var nat=naturalDayKey(now,H);
  if(d.key<nat){
    d.key=nat; d.startedAt=Math.min(now,dayBoundaryMs(addDaysKey(nat,-1),H));
    return true;
  }
  if(now-d.startedAt>=DAY_MAX_MS){
    d.key=addDaysKey(d.key,1); d.startedAt=now;
    return true;
  }
  return false;
}
function todayKey(){
  if(typeof state==='undefined' || !state){ return naturalDayKey(Date.now(),5); }
  ensureDay();
  return state.day.key;
}
function canEndDay(){
  if(!state) return false;
  ensureDay();
  var b=dayBoundaryMs(state.day.key,dayHour()), now=Date.now();
  return now<b && now>=b-DAY_END_EARLY_MS;
}
function hourLabel(h){ return pad2(h)+':00'; }
function addDaysKey(key,delta){ var d=parseDateKey(key); d.setDate(d.getDate()+delta); return localDateKey(d); }
function weekKeyFor(key){
  var d=parseDateKey(key);
  var day=d.getDay();
  var diffToMonday=(day===0?-6:1-day);
  d.setDate(d.getDate()+diffToMonday);
  return localDateKey(d);
}
function compareKeys(a,b){ return a<b?-1:(a>b?1:0); }
function formatDateHuman(key){
  var d=parseDateKey(key);
  return MONTH_LABELS[d.getMonth()].slice(0,3)+' '+d.getDate();
}
function formatMinutes(min){
  min=Math.round(min);
  if(min<60) return min+'m';
  var h=Math.floor(min/60), m=min%60;
  return h+'h'+(m?' '+m+'m':'');
}
function todayMonthKey(){ return todayKey().slice(0,7); }
function monthKeyOf(key){ return key.slice(0,7); }

/* =====================================================================
   STORAGE — layered & defensive: Claude storage -> localStorage -> memory.
   Never allowed to throw or hang; loadState() always resolves, persist()
   never blocks rendering even if every backend is unavailable.
   ===================================================================== */
var storageMode='detecting'; // 'claude' | 'local' | 'memory'
var memoryStore={};
function waitForClaudeStorage(maxWaitMs){
  return new Promise(function(resolve){
    var waited=0, step=100;
    (function poll(){
      try{
        if(window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function'){
          resolve(true); return;
        }
      }catch(e){ /* keep polling */ }
      waited+=step;
      if(waited>=maxWaitMs){ resolve(false); return; }
      setTimeout(poll,step);
    })();
  });
}
function detectStorageMode(){
  if(storageMode!=='detecting') return Promise.resolve(storageMode);
  return waitForClaudeStorage(1500).then(function(hasClaude){
    if(hasClaude){ storageMode='claude'; return storageMode; }
    try{
      var probe='__ascend_probe__';
      window.localStorage.setItem(probe,'1');
      window.localStorage.removeItem(probe);
      storageMode='local';
    }catch(e){
      storageMode='memory';
    }
    return storageMode;
  });
}
function safeParse(str){ try{ return JSON.parse(str); }catch(e){ return null; } }
function loadState(){
  return detectStorageMode().then(function(mode){
    if(mode==='claude'){
      return window.storage.get(STORAGE_KEY,false).then(function(res){
        return (res && res.value)?safeParse(res.value):null;
      }).catch(function(){ return null; });
    }
    if(mode==='local'){
      try{
        var v=window.localStorage.getItem(STORAGE_KEY);
        return v?safeParse(v):null;
      }catch(e){ return null; }
    }
    return memoryStore[STORAGE_KEY]?safeParse(memoryStore[STORAGE_KEY]):null;
  }).catch(function(){ return null; });
}
var saveInFlight=false, savePending=false;
function persist(){
  if(saveInFlight){ savePending=true; return; }
  saveInFlight=true;
  var json;
  try{ json=JSON.stringify(state); }catch(e){ saveInFlight=false; return; }
  try{ widgetSync(); }catch(e){}
  var finish=function(){ saveInFlight=false; if(savePending){ savePending=false; persist(); } };
  detectStorageMode().then(function(mode){
    if(mode==='claude'){
      window.storage.set(STORAGE_KEY,json,false).catch(function(e){ console.error('Ascend: save failed',e); }).then(finish);
    } else if(mode==='local'){
      try{ window.localStorage.setItem(STORAGE_KEY,json); }catch(e){ console.error('Ascend: local save failed',e); }
      finish();
    } else {
      memoryStore[STORAGE_KEY]=json;
      finish();
    }
  }).catch(finish);
}

/* =====================================================================
   ANDROID WIDGET BRIDGE — only active inside the Capacitor Android app.
   On the web / PWA every function here quietly does nothing.
   The app writes a snapshot of Today for the home-screen widget; taps on
   the widget are queued natively and replayed here through the normal
   app functions, so coins, streaks and achievements follow ONE set of rules.
   ===================================================================== */
function nativePlugin(n){
  try{
    var C=window.Capacitor;
    if(C && typeof C.isNativePlatform==='function' && C.isNativePlatform() && C.Plugins && C.Plugins[n]) return C.Plugins[n];
  }catch(e){}
  return null;
}
function flattenParts(nodes,taskId,depth,out){
  nodes.forEach(function(n){
    var kids=n.parts&&n.parts.length, st=kids?leafStats(n.parts):[0,0];
    out.push({ k:'p', id:taskId, pid:n.id, name:n.name, done:nodeDone(n), depth:depth, leaf:!kids, np:st[0], pd:st[1] });
    if(kids) flattenParts(n.parts,taskId,depth+1,out);
  });
}
function widgetSnapshot(){
  var t=todayKey(), items=[];
  var allTasks=(state.tasks||[]);
  allTasks.filter(function(x){ return !x.done; }).concat(allTasks.filter(function(x){ return x.done && x.completedAt===t; })).forEach(function(x){
    var parts=x.parts||[], st=leafStats(parts);
    items.push({ k:'t', id:x.id, name:x.name, tier:tierInfo(x.tier||nearestTier(x.points)).label, done:!!x.done, np:st[0], pd:st[1] });
    if(parts.length && !x.done) flattenParts(parts,x.id,0,items);
  });
  (state.habits||[]).forEach(function(h){
    if(h.archived || compareKeys(h.createdAt,t)>0) return;
    items.push({ k:'h', id:h.id, name:h.name, tier:tierInfo(h.difficulty).label, done:h.completions.hasOwnProperty(t) });
  });
  (state.challenges||[]).forEach(function(c){
    items.push({ k:'c', id:c.id, name:c.name, tier:tierInfo(c.tier||nearestTier(c.points)).label, n:challengeCountToday(c.id), limit:c.limit||0 });
  });
  var w=wheelToday();
  items.push({ k:'w', id:'wheel', name:w?w.mission:'Daily wheel', status:w?w.status:'none' });
  return { v:3, date:t, h:dayHour(), endsAt:dayBoundaryMs(t,dayHour()), items:items };
}
function widgetSync(){
  var B=nativePlugin('WidgetBridge');
  if(!B || !state) return;
  try{ B.sync({ value:JSON.stringify(widgetSnapshot()) }); }catch(e){}
}
function applyWidgetQueue(){
  var B=nativePlugin('WidgetBridge');
  if(!B || !state) return;
  B.takeQueue().then(function(r){
    var q=(r && r.value)?safeParse(r.value):null;
    if(!q || !q.length) return;
    var n=0;
    replayAward=true;
    try{
      q.forEach(function(e){
        try{
          var dk=(e.date && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && compareKeys(e.date,todayKey())<=0)?e.date:todayKey();
          if(e.a==='habit'){
            var h=findHabit(e.id);
            if(h && h.completions.hasOwnProperty(dk)!==!!e.want){ toggleHabitDay(h.id,dk); n++; }
          } else if(e.a==='task'){
            var tk=findTask(e.id);
            if(tk && !!tk.done!==!!e.want){ toggleTask(tk.id,dk); n++; }
          } else if(e.a==='part'){
            var tk2=findTask(e.id);
            var pt2=tk2?findNode(tk2.parts,e.pid):null;
            if(pt2 && !!nodeDone(pt2)!==!!e.want){ togglePart(tk2.id,pt2.id,dk); n++; }
          } else if(e.a==='wheel'){
            var wl=state.wheel;
            if(wl && wl.dateKey===dk && wl.status==='pending'){ claimWheel(dk); n++; }
          } else if(e.a==='chal'){
            if(e.d>0) logChallenge(e.id,dk); else undoChallenge(e.id,dk);
            n++;
          }
        }catch(err){ console.error('Ascend: widget action failed',err); }
      });
    } finally { replayAward=false; }
    if(n){ queueToast('Synced '+n+' widget tap'+(n>1?'s':'')); render(); }
  }).catch(function(){ replayAward=false; });
}

/* =====================================================================
   FORMAT / ESCAPE HELPERS
   ===================================================================== */
function esc(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g,function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;';
  });
}
function clampInt(v,min,max,fallback){
  var n=parseInt(v,10);
  if(isNaN(n)) n=fallback;
  if(min!==undefined && n<min) n=min;
  if(max!==undefined && n>max) n=max;
  return n;
}

/* =====================================================================
   LEVEL / XP CURVE
   ===================================================================== */
function xpForLevel(level){ return Math.round(50*Math.pow(level,1.5)); }
function levelInfo(totalXp){
  var level=1, used=0, guard=0;
  while(guard<2000){
    var need=xpForLevel(level);
    if(used+need>totalXp) break;
    used+=need; level++; guard++;
  }
  var need=xpForLevel(level);
  return { level:level, xpIntoLevel:totalXp-used, xpForNext:need, progress:need>0?(totalXp-used)/need:0 };
}
function levelTierName(level){
  if(level>=21) return 'Ancient Bloom';
  if(level>=11) return 'Young Tree';
  if(level>=6) return 'Sapling';
  if(level>=3) return 'Sprout';
  return 'Seed';
}

/* =====================================================================
   STREAKS
   ===================================================================== */
function restUsedInWeek(habit, key){
  var wk=weekKeyFor(key);
  return (habit.freezes||[]).filter(function(k){ return weekKeyFor(k)===wk; }).length;
}
function canRest(habit, key){
  if(compareKeys(key,habit.createdAt)<0) return false;
  if(compareKeys(key,todayKey())>0) return false;
  if(isCoveredDay(habit,key)) return false;
  return restUsedInWeek(habit,key)<1;
}
function perfectDayToday(){
  var t=todayKey();
  var act=(state.habits||[]).filter(function(h){ return !h.archived && compareKeys(h.createdAt,t)<=0; });
  return act.length>=3 && act.every(function(h){ return h.completions.hasOwnProperty(t); });
}
function isCoveredDay(habit, key){
  return habit.completions.hasOwnProperty(key) || (habit.freezes||[]).indexOf(key)!==-1;
}
function streakEndingAt(habit, dateKey){
  var count=0, key=dateKey, guard=0;
  while(guard<3660){
    if(isCoveredDay(habit,key)){ count++; key=addDaysKey(key,-1); guard++; }
    else break;
  }
  return count;
}
function currentStreak(habit){
  var t=todayKey();
  if(isCoveredDay(habit,t)) return streakEndingAt(habit,t);
  var y=addDaysKey(t,-1);
  if(isCoveredDay(habit,y)) return streakEndingAt(habit,y);
  return 0;
}
function streakMultiplier(streak){
  if(streak>=30) return 1.5;
  if(streak>=14) return 1.35;
  if(streak>=7) return 1.2;
  if(streak>=3) return 1.1;
  return 1.0;
}
function boostPercent(){
  var sum=0;
  (state.habits||[]).forEach(function(h){
    if(h.archived) return;
    sum+=Math.floor(currentStreak(h)/BOOST_STREAK_DAYS)*BOOST_PER_BLOCK;
  });
  var cap=(state.settings && state.settings.boostCap!==undefined)?state.settings.boostCap:DEFAULT_BOOST_CAP;
  return Math.max(0,Math.min(cap,sum));
}
function bestStreakAcrossHabits(){
  var best=0;
  (state.habits||[]).forEach(function(h){ var s=currentStreak(h); if(s>best) best=s; });
  return best;
}
function longestStreakEver(habit){
  var keys=Object.keys(habit.completions||{}).concat(habit.freezes||[]);
  keys=keys.filter(function(k,idx){ return keys.indexOf(k)===idx; }).sort(compareKeys);
  if(!keys.length) return 0;
  var best=1, run=1;
  for(var i=1;i<keys.length;i++){
    if(addDaysKey(keys[i-1],1)===keys[i]) run++;
    else run=1;
    if(run>best) best=run;
  }
  return best;
}
function longestStreakEverAcrossHabits(){
  var best=0;
  (state.habits||[]).forEach(function(h){ var s=longestStreakEver(h); if(s>best) best=s; });
  return best;
}

/* =====================================================================
   DERIVED TOTALS (ledger-derived, not stored counters — self-healing)
   ===================================================================== */
function computeDerived(){
  var totalXp=0, totalCompletions=0, tasksCompleted=0, emergencySessionsLogged=0;
  (state.habits||[]).forEach(function(h){
    Object.keys(h.completions||{}).forEach(function(k){
      totalXp+=h.completions[k];
      totalCompletions++;
    });
  });
  (state.tasks||[]).forEach(function(t){
    if(t.done){ totalXp+=t.pointsAwarded||0; tasksCompleted++; }
  });
  (state.challengeLogs||[]).forEach(function(l){ totalXp+=l.points||0; });
  (state.wheelLog||[]).forEach(function(l){ totalXp+=l.points||0; });
  var spent=0;
  (state.purchases||[]).forEach(function(p){ spent+=p.cost; });
  (state.topups||[]).forEach(function(t){ spent+=t.pointsSpent; });
  (state.pcLedger.sessions||[]).forEach(function(s){ if(s.type==='emergency') emergencySessionsLogged++; });
  var points=totalXp-spent;
  var cap=state.settings && state.settings.pointsCap;
  if(cap && cap>0 && points>cap) points=cap;
  var li=levelInfo(totalXp);
  return {
    xp:totalXp,
    points:points,
    pointsSpent:spent,
    totalCompletions:totalCompletions,
    tasksCompleted:tasksCompleted,
    emergencySessionsLogged:emergencySessionsLogged,
    challengesDone:(state.challengeLogs||[]).length,
    restDays:(state.habits||[]).reduce(function(n,h){ return n+(h.freezes||[]).length; },0),
    wheelsDone:(state.wheelLog||[]).length,
    bestStreak:bestStreakAcrossHabits(),
    bestStreakEver:longestStreakEverAcrossHabits(),
    level:li.level,
    xpIntoLevel:li.xpIntoLevel,
    xpForNext:li.xpForNext,
    progress:li.progress
  };
}
function categoryXp(catId){
  var xp=0;
  (state.challengeLogs||[]).forEach(function(l){
    var c=(state.challenges||[]).filter(function(x){ return x.id===l.challengeId; })[0];
    var cat=c?(c.category||'other'):(l.cat||'other');
    if(cat===catId) xp+=l.points||0;
  });
  (state.habits||[]).forEach(function(h){
    if((h.category||'other')!==catId) return;
    Object.keys(h.completions||{}).forEach(function(k){ xp+=h.completions[k]; });
  });
  return xp;
}
function categoryDerived(){
  return CATEGORIES.map(function(c){

var ACH_COIN={}; ACHIEVEMENTS.forEach(function(a){ ACH_COIN[a.id]=a.coin||0; });
function grantRetroAchievementCoins(){
  if(state.achCoinsGranted) return 0;
  state.achCoinsGranted=true;
  var total=0;
  (state.achievements||[]).forEach(function(u){
    if(u.coins===undefined && ACH_COIN[u.id]!==undefined){ u.coins=awardBonusCoins(ACH_COIN[u.id]); total+=u.coins; }
  });
  return total;
}
function reconcileAchievements(all){
  var t=todayKey(), lost=[];
  state.achievements=(state.achievements||[]).filter(function(u){
    var a=ACHIEVEMENTS.filter(function(x){ return x.id===u.id; })[0];
    if(!a || STICKY_ACH.indexOf(u.id)!==-1) return true;
    if(!all && u.unlockedAt!==t) return true;
    if(all && u.id==='perfect_day') return true;
    if(a.check(state,computeDerived())) return true;
    revokeCoins(u.coins||0,u.unlockedAt); lost.push(a.name); return false;
  });
  if(lost.length) queueToast('Achievement removed: '+lost[0]+(lost.length>1?' +'+(lost.length-1)+' more':'')+' \u2014 no longer earned');
  return lost.length;
}
function checkAchievements(){

  var d=computeDerived();
  var unlockedIds=(state.achievements||[]).map(function(a){ return a.id; });
  var newlyUnlocked=[];
  ACHIEVEMENTS.forEach(function(a){
    if(unlockedIds.indexOf(a.id)===-1 && a.check(state,d)){
      var got=awardBonusCoins(a.coin||0);
      state.achievements.push({ id:a.id, unlockedAt:todayKey(), coins:got });

    var sum=newlyUnlocked.reduce(function(n,x){ return n+x.coins; },0);
    queueToast('Achievement unlocked: '+newlyUnlocked[0].name+(newlyUnlocked.length>1?' +'+(newlyUnlocked.length-1)+' more':'')+(sum?' \u00b7 +'+fmtMoney(sum):''));

}

function validTier(d){ return TIERS.some(function(t){ return t.id===d; }); }
function tierInfo(id){ return TIERS.filter(function(t){ return t.id===id; })[0]||TIERS[2]; }
function tierPts(id){ var p=state.settings.difficultyPoints; return (p&&p[id])||tierInfo(id).pts; }
function nearestTier(pts){
  var best=TIERS[1], d=1e9;
  TIERS.forEach(function(t){ var x=Math.abs(t.pts-(pts||0)); if(x<d){ d=x; best=t; } });
  return best.id;
}
function taskXp(task){ return task.done?(task.pointsAwarded||0):tierPts(task.tier||nearestTier(task.points)); }
function luckyRoll(id,dk){
  var s=id+'|'+dk, h=2166136261;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  h^=h>>>13; h=Math.imul(h,0x5bd1e995); h^=h>>>15;
  return (h>>>0)/4294967296;
}

/* ---- coins (cents internally, shown as $) ---- */
function fmtMoney(c){ return (c<0?'-':'')+'$'+(Math.abs(c)/100).toFixed(2); }
function r2(x){ return Math.round(x*100)/100; }
function coinRoom(dateKey){
  return Math.max(0,state.settings.coinCapCents-state.wallet.cents);
}
function tierCoin(id){
  var tc=state.settings.tierCoins;
  return (tc && tc[id]!==undefined)?tc[id]:tierInfo(id).coin;
}
function awardBonusCoins(cents){
  var a=Math.min(Math.round(cents),coinRoom());
  if(a<=0) return 0;
  var w=state.wallet, t=todayKey();
  w.cents=Math.round(w.cents+a); w.daily[t]=Math.round((w.daily[t]||0)+a);
  return a;
}
var replayAward=false; /* true only while widget taps from earlier days are being applied */
function awardCoins(cents,dateKey){
  if(cents<=0 || (dateKey!==todayKey() && !replayAward)) return 0;
  var w=state.wallet;
  var exact=cents*(1+boostPercent()/100)+(w.carry||0);
  var whole=Math.floor(exact+1e-9);
  var a=Math.min(whole,coinRoom(dateKey));
  if(a<=0){ w.carry=Math.max(0,exact-whole); return 0; }
  w.carry=(a<whole)?0:Math.max(0,exact-whole); /* leftover fraction of a cent rolls into the next award */
  w.cents=Math.round(w.cents+a); w.daily[dateKey]=Math.round((w.daily[dateKey]||0)+a);
  return a;
}
function revokeCoins(a,dateKey){
  if(!a) return;
  var w=state.wallet; w.cents=r2(w.cents-a); w.daily[dateKey]=Math.max(0,r2((w.daily[dateKey]||0)-a)); /* may go negative: undoing earned coins after spending them leaves a debt */
}
function spendCoins(cents){
  if(!(cents>0) || cents>state.wallet.cents+0.001){ queueToast('Not enough coins for that'); render(); return; }
  state.wallet.cents=Math.max(0,r2(state.wallet.cents-cents));
  state.wallet.spent.push({ id:uid(), name:'', cents:cents, at:todayKey() });
  checkAchievements();
  persist(); render();
  queueToast('Spent '+fmtMoney(cents));
}
function undoSpend(id){
  var list=state.wallet.spent;
  for(var i=0;i<list.length;i++){
    if(list[i].id===id){
      state.wallet.cents=Math.min(state.settings.coinCapCents,r2(state.wallet.cents+list[i].cents));
      list.splice(i,1); break;
    }
  }
  persist(); render();
}

function addHabit(name,difficulty,category){
  name=(name||'').trim();
  if(!name) return;
  if(!validTier(difficulty)) difficulty='medium';
  if(CATEGORIES.filter(function(c){return c.id===category;}).length===0) category='other';
  state.habits.push({ id:uid(), name:name.slice(0,60), difficulty:difficulty, category:category, createdAt:todayKey(), archived:false, completions:{}, freezes:[] });
  ui.showAddHabit=false;

function toggleHabitDay(habitId,dateKey){
  var habit=findHabit(habitId);
  if(!habit) return;
  if(compareKeys(dateKey,todayKey())>0) return;
  if(compareKeys(dateKey,habit.createdAt)<0) return;
  var levelBefore=computeDerived().level;
  var lucky=false, bonus=0, coinGot=0, undone=false;
  if(habit.completions.hasOwnProperty(dateKey)){
    if(!habit.coins) habit.coins={};
    revokeCoins(habit.coins[dateKey]||0,dateKey); delete habit.coins[dateKey];
    if(habit.lucky && habit.lucky[dateKey]){ delete habit.lucky[dateKey]; state.luckyBonusCount=Math.max(0,(state.luckyBonusCount||0)-1); }
    delete habit.completions[dateKey]; undone=true;
  } else {
    var streak=streakEndingAt(habit,dateKey);
    var mult=streakMultiplier(streak);
    var base=(state.settings.difficultyPoints[habit.difficulty])||DIFFICULTY_POINTS[habit.difficulty]||10;
    var pts=Math.round(base*mult);
    if(luckyRoll(habit.id,dateKey)<LUCKY_CHANCE){
      bonus=Math.max(1,Math.round(base*LUCKY_BONUS_FRACTION));
      pts+=bonus;
      lucky=true;
      if(!habit.lucky) habit.lucky={};
      habit.lucky[dateKey]=bonus;
      state.luckyBonusCount=(state.luckyBonusCount||0)+1;
    }
    habit.completions[dateKey]=pts;
    coinGot=awardCoins(tierCoin(habit.difficulty),dateKey);
    ui.pop=habit.id+'|'+dateKey; buzz(18);
    if(!habit.coins) habit.coins={};
    habit.coins[dateKey]=coinGot;
  }
  if(undone) reconcileAchievements(false);
  var newAch=checkAchievements();
  var levelAfter=computeDerived().level;
  if(levelAfter>levelBefore) queueLevelUpToast(levelAfter);
  else if(newAch.length){ /* keep the achievement toast */ }
  else if(lucky) queueToast('\u2728 Lucky bonus! +'+bonus+' xp on '+habit.name+(coinGot?' \u00b7 +'+fmtMoney(coinGot):''));
  else if(coinGot) queueToast('+'+fmtMoney(coinGot));
  persist(); render();
}

  var list=state.habits||[];

  list.forEach(function(h,i){ if(!h.archived) activeIdxs.push(i); });
  var pos=activeIdxs.indexOf(list.findIndex(function(h){ return h.id===habitId; }));
  var targetPos=pos+dir;
  if(pos<0||targetPos<0||targetPos>=activeIdxs.length) return;

/* =====================================================================
   ACTIONS — TASKS
   ===================================================================== */
function findTask(id){ return (state.tasks||[]).filter(function(t){ return t.id===id; })[0]; }
/* Parts form a tree: every part can have sub-parts. A part with sub-parts is done when all of them are done.
   Tasks and parts can carry a note of any length. */
function nodeDone(n){ return (n.parts&&n.parts.length)?n.parts.every(nodeDone):!!n.done; }
function leafStats(nodes){
  var t=0,d=0;
  (nodes||[]).forEach(function(n){
    if(n.parts&&n.parts.length){ var r=leafStats(n.parts); t+=r[0]; d+=r[1]; }
    else { t++; if(n.done) d++; }
  });
  return [t,d];
}
function findNode(nodes,id){
  for(var i=0;i<(nodes||[]).length;i++){
    var n=nodes[i];
    if(n.id===id) return n;
    if(n.parts){ var f=findNode(n.parts,id); if(f) return f; }
  }
  return null;
}
function findContainer(nodes,id){
  for(var i=0;i<(nodes||[]).length;i++){
    if(nodes[i].id===id) return nodes;
    if(nodes[i].parts){ var f=findContainer(nodes[i].parts,id); if(f) return f; }
  }
  return null;
}
function syncDone(nodes){ (nodes||[]).forEach(function(n){ if(n.parts&&n.parts.length){ syncDone(n.parts); n.done=n.parts.every(function(k){ return k.done; }); } }); }
function setBranch(n,val){ if(n.parts&&n.parts.length) n.parts.forEach(function(k){ setBranch(k,val); }); n.done=!!val; }
function lastLeaf(nodes){ var r=null; (nodes||[]).forEach(function(n){ var x=(n.parts&&n.parts.length)?lastLeaf(n.parts):n; if(x) r=x; }); return r; }
function allPartsDone(task){ return !!(task.parts && task.parts.length && task.parts.every(nodeDone)); }
function cloneNodes(nodes){ return (nodes||[]).map(function(n){ var o={ id:n.id, name:n.name, done:!!n.done, note:n.note||'' }; if(n.parts&&n.parts.length) o.parts=cloneNodes(n.parts); return o; }); }
function cleanNodes(nodes){
  var out=[];
  (nodes||[]).forEach(function(n){
    var name=String(n.name||'').trim().slice(0,120);
    if(!name) return;
    var o={ id:n.id||uid(), name:name, done:!!n.done, note:String(n.note||'') };
    var kids=cleanNodes(n.parts);
    if(kids.length) o.parts=kids;
    out.push(o);
  });
  return out;
}
function newTaskDraft(){ return { id:null, name:'', tier:'easy', deadline:'', note:'', parts:[] }; }
function taskToDraft(t){ return { id:t.id, name:t.name, tier:t.tier||nearestTier(t.points), deadline:t.deadline||'', note:t.note||'', parts:cloneNodes(t.parts) }; }
function captureDraft(){
  var d=ui.taskDraft; if(!d) return;
  var form=document.querySelector('form[data-form="add-task"],form[data-form="edit-task"]');
  if(!form) return;
  var g=function(n){ var el=form.elements[n]; return el?el.value:''; };
  d.name=g('name'); d.tier=g('tier')||d.tier; d.deadline=g('deadline'); d.note=g('note');
  form.querySelectorAll('.pe-name').forEach(function(el){ var n=findNode(d.parts,el.getAttribute('data-pid')); if(n) n.name=el.value; });
  form.querySelectorAll('.pe-note').forEach(function(el){ var n=findNode(d.parts,el.getAttribute('data-pid')); if(n) n.note=el.value; });
}
function newNode(){ return { id:uid(), name:'', done:false, note:'' }; }
function draftAddRoot(){ captureDraft(); var n=newNode(); ui.taskDraft.parts.push(n); ui.focusPid=n.id; render(); }
function draftAddChild(pid){
  captureDraft(); var p=findNode(ui.taskDraft.parts,pid); if(!p) return;
  var n=newNode(); p.parts=p.parts||[]; p.parts.push(n); ui.focusPid=n.id; render();
}
function draftAddSibling(pid){
  captureDraft(); var arr=findContainer(ui.taskDraft.parts,pid); if(!arr) return;
  var n=newNode(), i=arr.findIndex(function(x){ return x.id===pid; });
  arr.splice(i+1,0,n); ui.focusPid=n.id; render();
}
function draftRemove(pid){
  captureDraft(); var arr=findContainer(ui.taskDraft.parts,pid); if(!arr) return;
  var i=arr.findIndex(function(x){ return x.id===pid; }); arr.splice(i,1);
  (function prune(nodes){ nodes.forEach(function(n){ if(n.parts){ if(!n.parts.length) delete n.parts; else prune(n.parts); } }); })(ui.taskDraft.parts);
  render();
}
function draftToggleNote(pid){ captureDraft(); var n=findNode(ui.taskDraft.parts,pid); if(n){ n._open=!n._open; } render(); }
function addTaskFromDraft(){

  state.tasks.push({ id:uid(), name:name.slice(0,80), tier:tier, points:tierPts(tier), deadline:d.deadline||null, done:false, createdAt:todayKey(), completedAt:null, pointsAwarded:0, note:d.note||'', parts:parts });
  ui.showAddTask=false; ui.taskDraft=null;

function editTaskFromDraft(){
  captureDraft();

  var task=findTask(d.id); if(!task) return;
  var name=(d.name||'').trim();
  if(!name){ queueToast('Give the task a name'); render(); return; }
  var levelBefore=computeDerived().level;
  task.name=name.slice(0,80);
  if(!task.done){ if(validTier(d.tier)) task.tier=d.tier; task.points=tierPts(task.tier); }
  task.deadline=d.deadline||null; task.note=d.note||'';
  if(!task.done){
    task.parts=cleanNodes(d.parts); syncDone(task.parts);
    if(allPartsDone(task)) completeTask(task);
  }
  ui.editingTaskId=null; ui.taskDraft=null;
  afterTaskChange(levelBefore,false);
}
function completeTask(task,dateKey){
  if(!validTier(task.tier)) task.tier=nearestTier(task.points);
  task.points=tierPts(task.tier);
  task.done=true; task.completedAt=dateKey||todayKey(); task.pointsAwarded=task.points;
  task.coinsAwarded=awardCoins(tierCoin(task.tier),task.completedAt);
  ui.pop='t|'+task.id; buzz(18);
}
function reopenTask(task){
  revokeCoins(task.coinsAwarded||0,task.completedAt); task.coinsAwarded=0;
  task.done=false; task.completedAt=null; task.pointsAwarded=0;
}
function afterTaskChange(levelBefore,reopened){
  if(reopened) reconcileAchievements(false);
  checkAchievements();
  var levelAfter=computeDerived().level;
  if(levelAfter>levelBefore) queueLevelUpToast(levelAfter);
  persist(); render();
}
function toggleTask(taskId,dateKey){
  var task=findTask(taskId);
  if(!task) return;
  var levelBefore=computeDerived().level, wasDone=task.done;
  if(task.done){
    reopenTask(task);
    var ll=lastLeaf(task.parts); if(ll){ ll.done=false; syncDone(task.parts); }
  } else {
    (task.parts||[]).forEach(function(n){ setBranch(n,true); });
    completeTask(task,dateKey);
  }
  afterTaskChange(levelBefore,wasDone);
}
function togglePart(taskId,partId,dateKey){
  var task=findTask(taskId);
  if(!task || !task.parts) return;
  var node=findNode(task.parts,partId);
  if(!node) return;
  var levelBefore=computeDerived().level, wasDone=task.done;
  setBranch(node,!nodeDone(node));
  syncDone(task.parts);
  var all=allPartsDone(task);
  if(all && !task.done) completeTask(task,dateKey);
  else if(!all && task.done) reopenTask(task);
  afterTaskChange(levelBefore,wasDone && !all);
}
function deleteTask(taskId){
  state.tasks=(state.tasks||[]).filter(function(t){ return t.id!==taskId; });

function moveTask(id,dir){
  var open=(state.tasks||[]).filter(function(t){ return !t.done; });
  var i=open.findIndex(function(t){ return t.id===id; }), j=i+dir;
  if(i<0||j<0||j>=open.length) return;
  var a=state.tasks.indexOf(open[i]), b=state.tasks.indexOf(open[j]);
  var tmp=state.tasks[a]; state.tasks[a]=state.tasks[b]; state.tasks[b]=tmp;
  persist(); render();
}
function sortTasksByDeadline(){
  var open=(state.tasks||[]).filter(function(t){ return !t.done; });
  var sorted=open.slice().sort(function(a,b){
    if(a.deadline&&b.deadline) return compareKeys(a.deadline,b.deadline);
    if(a.deadline) return -1; if(b.deadline) return 1; return 0;
  });
  var k=0;
  state.tasks=state.tasks.map(function(t){ return t.done?t:sorted[k++]; });
  persist(); render();
}

function applySettingsFields(fields){
  if(fields.dailyFreeMinutes!==undefined) state.pcLedger.dailyFreeMinutes=clampInt(fields.dailyFreeMinutes,0,1440,120);
  if(fields.weeklyEmergencyMinutes!==undefined) state.pcLedger.weeklyEmergencyMinutes=clampInt(fields.weeklyEmergencyMinutes,0,10080,180);
  if(fields.topupPointCost!==undefined) state.pcLedger.topupPointCost=clampInt(fields.topupPointCost,1,100000,50);
  if(fields.topupMinutes!==undefined) state.pcLedger.topupMinutes=clampInt(fields.topupMinutes,1,1440,15);
  TIERS.forEach(function(t){ if(fields[t.id]!==undefined) state.settings.difficultyPoints[t.id]=clampInt(fields[t.id],1,10000,t.pts); });
  if(fields.coinCap!==undefined) state.settings.coinCapCents=Math.round(Math.max(0,parseFloat(fields.coinCap)||0)*100);
  if(fields.boostCap!==undefined) state.settings.boostCap=clampInt(fields.boostCap,0,1000,DEFAULT_BOOST_CAP);
  TIERS.forEach(function(t){
    var k='coin_'+t.id;
    if(fields[k]!==undefined){ var v=parseFloat(fields[k]); state.settings.tierCoins[t.id]=isNaN(v)?t.coin:Math.max(0,Math.round(v)); }
  });
  if(state.wallet.cents>state.settings.coinCapCents) state.wallet.cents=state.settings.coinCapCents;
  persist(); render();
}
/* ---- delayed settings: changes wait 24h, then need an explicit confirm ---- */
var SETTINGS_DELAY_MS=24*60*60*1000;
function sanitizeSettingFields(f){
  var o={};
  TIERS.forEach(function(t){
    if(f[t.id]!==undefined) o[t.id]=clampInt(f[t.id],1,10000,state.settings.difficultyPoints[t.id]);
    var k='coin_'+t.id;
    if(f[k]!==undefined){ var v=parseFloat(f[k]); o[k]=isNaN(v)?tierCoin(t.id):Math.max(0,Math.round(v)); }
  });
  if(f.coinCap!==undefined) o.coinCap=Math.max(0,r2(parseFloat(f.coinCap)||0));
  if(f.boostCap!==undefined) o.boostCap=clampInt(f.boostCap,0,1000,state.settings.boostCap);
  return o;
}
function currentSettingValue(k){
  if(k==='coinCap') return r2(state.settings.coinCapCents/100);
  if(k==='boostCap') return state.settings.boostCap;
  if(k.indexOf('coin_')===0) return tierCoin(k.slice(5));
  return state.settings.difficultyPoints[k];
}
function settingLabel(k){
  if(k==='coinCap') return 'Max coin balance ($)';
  if(k==='boostCap') return 'Max streak boost (%)';
  if(k.indexOf('coin_')===0) return tierInfo(k.slice(5)).label+' coins per check-in (cents)';
  return tierInfo(k).label+' XP';
}
function settingChanges(fields){
  var out=[];
  Object.keys(fields).forEach(function(k){
    var cur=currentSettingValue(k);
    if(cur!==fields[k]) out.push({ key:k, label:settingLabel(k), from:cur, to:fields[k] });
  });
  return out;
}
function updateSettings(fields){
  var clean=sanitizeSettingFields(fields);
  var tighten={}, loosen={}, nT=0, nL=0;
  settingChanges(clean).forEach(function(c){
    /* lower = tighter (less XP, fewer coins, smaller caps); higher = looser */
    if(c.to<c.from){ tighten[c.key]=c.to; nT++; } else { loosen[c.key]=c.to; nL++; }
  });
  if(!nT && !nL){ persist(); render(); queueToast('No changes to save'); return; }
  if(nT){
    applySettingsFields(tighten);
    if(state.settings.pending){
      Object.keys(tighten).forEach(function(k){ delete state.settings.pending.fields[k]; });
      if(!Object.keys(state.settings.pending.fields).length) state.settings.pending=null;
    }
  }
  if(nL){
    var merged={}, old=state.settings.pending;
    if(old) Object.keys(old.fields).forEach(function(k){ merged[k]=old.fields[k]; });
    Object.keys(loosen).forEach(function(k){ merged[k]=loosen[k]; });
    state.settings.pending={ fields:merged, requestedAt:Date.now(), applyAt:Date.now()+SETTINGS_DELAY_MS };
    ui.pendingPromptDismissed=false;
  }
  persist(); render();
  if(nT && nL) queueToast('Lower values applied now \u2014 increases wait 24 hours');
  else if(nT) queueToast('Applied \u2014 tighter limits take effect right away');
  else queueToast('Scheduled \u2014 increases can be applied in 24 hours');
}
function pendingDue(){ var p=state.settings.pending; return !!(p && Date.now()>=p.applyAt); }
function applyPending(){
  var p=state.settings.pending; if(!p) return;
  applySettingsFields(p.fields);
  state.settings.pending=null;
  ui.pendingPromptDismissed=false;
  persist(); render();
  queueToast('Changes applied');
}
function discardPending(){
  state.settings.pending=null; ui.pendingPromptDismissed=false;
  persist(); render();
  queueToast('Pending changes discarded');
}
function fmtVal(k,v){ return k==='coinCap'?'$'+v : (k==='boostCap'?v+'%' : String(v)); }
function pendingListHtml(p){

  // changes that already equal the live value aren't shown

}

function normalizeState(s){

  if(!s.pcLedger) s.pcLedger={ dailyFreeMinutes:120, weeklyEmergencyMinutes:180, topupPointCost:50, topupMinutes:15, sessions:[], activeTimer:null };
  if(!s.pcLedger.sessions) s.pcLedger.sessions=[];

  if(s.pcLedger.topupMinutes===undefined) s.pcLedger.topupMinutes=15;
  if(s.pcLedger.activeTimer===undefined) s.pcLedger.activeTimer=null;
  if(!s.lastOpenedDate) s.lastOpenedDate=null;
  TIERS.forEach(function(t){ if(s.settings.difficultyPoints[t.id]===undefined) s.settings.difficultyPoints[t.id]=t.pts; });
  if(s.settings.coinCapCents===undefined) s.settings.coinCapCents=DEFAULT_COIN_CAP;
  if(s.settings.dailyCoinCapCents===undefined) s.settings.dailyCoinCapCents=DEFAULT_DAILY_COIN_CAP;
  if(!s.settings.v3){
    s.settings.v3=true;
    if(s.settings.coinCapCents<DEFAULT_COIN_CAP) s.settings.coinCapCents=DEFAULT_COIN_CAP;

  }

  if(!s.challengeLogs) s.challengeLogs=[];
  if(!s.wheelLog) s.wheelLog=[];
  if(s.wheel===undefined) s.wheel=null;
  if(!s.wallet) s.wallet={ cents:0, daily:{}, spent:[] };

  if(!s.wallet.spent) s.wallet.spent=[];
  if(s.wallet.cents>s.settings.coinCapCents) s.wallet.cents=s.settings.coinCapCents;
  s.habits.forEach(function(h){

/* =====================================================================
   RECAP (new-day detection)
   ===================================================================== */
function buildRecap(dateKey){
  var habitsDone=0, habitsTotal=0, points=0;
  (state.habits||[]).forEach(function(h){
    if(h.archived) return;
    if(compareKeys(h.createdAt,dateKey)>0) return;
    habitsTotal++;
    if(h.completions.hasOwnProperty(dateKey)){ habitsDone++; points+=h.completions[dateKey]; }
  });
  (state.tasks||[]).forEach(function(t){ if(t.completedAt===dateKey) points+=t.pointsAwarded; });
  points+=extraPointsOn(dateKey);
  var pcMinutes=0;
  sessionsForDay(dateKey).forEach(function(s){ pcMinutes+=s.minutes; });
  return { dateKey:dateKey, habitsDone:habitsDone, habitsTotal:habitsTotal, points:points, pcMinutes:pcMinutes };
}
function checkDayRollover(){
  if(!state) return;
  var before=state.day?state.day.key:null;
  ensureDay();
  if(state.day.key!==before){
    checkNewDay(); checkAchievements(); persist(); render();
    return;
  }
  var ce=canEndDay();
  if(ce!==ui.canEndShown && ui.activeTab==='today' && !document.querySelector('.overlay')) render();
}
function endDay(){
  ui.confirmEndDay=false;
  if(!canEndDay()){ queueToast('You can end the day during its last 12 hours'); render(); return; }
  var prev=state.day.key;
  ui.recapData=buildRecap(prev); ui.showRecap=true;
  state.day={ key:addDaysKey(prev,1), startedAt:Date.now() };
  state.lastOpenedDate=state.day.key;
  checkAchievements();
  persist(); render();
}
function setDayHour(h){
  h=parseInt(h,10);
  if(!(h>=0 && h<=12)){ queueToast('Pick an hour between 00:00 and 12:00'); render(); return; }
  state.settings.dayStartHour=h; ensureDay();
  persist(); render(); queueToast('A new day now starts at '+hourLabel(h));
}
function checkNewDay(){
  var t=todayKey();
  if(state.lastOpenedDate && state.lastOpenedDate!==t){
    ui.showRecap=true;
    ui.recapData=buildRecap(state.lastOpenedDate);
  }
  state.lastOpenedDate=t;
}

function coinLogEntries(){
  var out=[];
  (state.habits||[]).forEach(function(h){
    var c=h.coins||{};
    Object.keys(c).forEach(function(k){ if(c[k]>0) out.push({ date:k, kind:'Habit', name:h.name, cents:c[k] }); });
  });
  (state.tasks||[]).forEach(function(t){ if(t.done && t.coinsAwarded>0) out.push({ date:t.completedAt||'', kind:'Task', name:t.name, cents:t.coinsAwarded }); });
  (state.challengeLogs||[]).forEach(function(l){ if(l.coins>0) out.push({ date:l.dateKey, kind:'Challenge', name:l.name, cents:l.coins }); });
  (state.wheelLog||[]).forEach(function(l){ if(l.coins>0) out.push({ date:l.dateKey, kind:'Daily wheel', name:l.name, cents:l.coins }); });
  (state.achievements||[]).forEach(function(u){
    if(u.coins>0){ var a=ACHIEVEMENTS.filter(function(x){ return x.id===u.id; })[0]; out.push({ date:u.unlockedAt||'', kind:'Achievement', name:a?a.name:u.id, cents:u.coins }); }
  });
  ((state.wallet&&state.wallet.spent)||[]).forEach(function(x){ out.push({ date:x.at||'', kind:'Spent', name:x.name||'Spent', cents:-x.cents }); });
  out.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
  return out;
}

function renderStats(){

  for(var i=6;i>=0;i--) days.push(addDaysKey(k,-i));
  var maxPts=1;
  var dayPoints=days.map(function(dk){
    var pts=0;
    (state.habits||[]).forEach(function(h){ if(h.completions.hasOwnProperty(dk)) pts+=h.completions[dk]; });
    (state.tasks||[]).forEach(function(t){ if(t.completedAt===dk) pts+=t.pointsAwarded; });
    pts+=extraPointsOn(dk);
    if(pts>maxPts) maxPts=pts;
    return pts;
  });
  var chartInner='<h2 class="section-title" style="margin-bottom:0;">XP — last 7 days</h2><div class="bar-chart">';

  if(!shownAch.length){
    achvInner+='<div class="empty">Everything is earned. Tap "Show earned" to see them.</div>';
  } else {
    achvInner+='<div class="achv-scroll"><div class="achv-grid">';
    shownAch.forEach(function(a){
      var isUnlocked=unlockedIds.indexOf(a.id)!==-1;

    '<div class="totals-cell"><div class="totals-val">'+d.tasksCompleted+'</div><div class="totals-label">Tasks completed</div></div>'+
    '<div class="totals-cell"><div class="totals-val">'+d.restDays+'</div><div class="totals-label">Rest days used</div></div>'+

/* =====================================================================
   SETTINGS GATE — hidden door (tap the wordmark 7x), PIN, then a cooling-off
   wait. It's friction against impulse changes, not real security.
   ===================================================================== */
var COOLDOWN_MS=45000, LOCKOUT_MS=5*60000, TAPS_NEEDED=7;
var gateTickHandle=null;
function pinHash(p){
  var s='ascend|'+p+'|v1', h=5381;
  for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0;
  return String(h>>>0);
}
function lockSettings(){ ui.settingsUnlocked=false; ui.cooldownUntil=0; ui.gateError=null; stopGateTick(); }
function openSettingsDoor(){
  if(location.hash==='#glance') location.hash='';
  lockSettings();
  ui.activeTab='settings'; ui.fade=true; render(); startGateTick();
  try{ window.scrollTo(0,0); }catch(e){}
}
function wordmarkTap(){
  var now=Date.now();
  ui.taps=ui.taps.filter(function(t){ return now-t<4000; });
  ui.taps.push(now);
  if(ui.taps.length>=TAPS_NEEDED){ ui.taps=[]; openSettingsDoor(); }
}
function submitPin(pin,pin2){
  pin=String(pin||'').trim();
  if(!state.settings.pinHash){
    if(!/^\d{4,8}$/.test(pin)){ ui.gateError='Use 4 to 8 digits.'; render(); return; }
    if(pin!==String(pin2||'').trim()){ ui.gateError='The two PINs don\'t match.'; render(); return; }
    state.settings.pinHash=pinHash(pin); ui.settingsUnlocked=true; ui.cooldownUntil=0; ui.gateError=null;
    persist(); render(); queueToast('PIN set'); return;
  }
  if(pinHash(pin)===state.settings.pinHash){
    ui.settingsUnlocked=true; ui.pinFails=0; ui.gateError=null;
    ui.cooldownUntil=Date.now()+COOLDOWN_MS;
    render(); startGateTick(); return;
  }
  ui.pinFails++;
  if(ui.pinFails>=3){ ui.pinFails=0; ui.lockoutUntil=Date.now()+LOCKOUT_MS; ui.gateError=null; startGateTick(); }
  else ui.gateError='Wrong PIN ('+(3-ui.pinFails)+' tries left).';
  render();
}
function changePin(pin,pin2){
  pin=String(pin||'').trim();
  if(!/^\d{4,8}$/.test(pin)){ queueToast('PIN must be 4 to 8 digits'); render(); return; }
  if(pin!==String(pin2||'').trim()){ queueToast('PINs don\'t match'); render(); return; }
  state.settings.pinHash=pinHash(pin); persist(); render(); queueToast('PIN changed');
}
function startGateTick(){
  stopGateTick();
  gateTickHandle=setInterval(function(){
    var now=Date.now();
    var cd=document.querySelectorAll('[data-cooldown]'), lo=document.querySelectorAll('[data-lockout]');
    for(var i=0;i<cd.length;i++) cd[i].textContent=Math.max(0,Math.ceil((ui.cooldownUntil-now)/1000));
    for(var j=0;j<lo.length;j++){ var s=Math.max(0,Math.ceil((ui.lockoutUntil-now)/1000)); lo[j].textContent=Math.floor(s/60)+':'+pad2(s%60); }
    var doneCd=ui.settingsUnlocked && ui.cooldownUntil && now>=ui.cooldownUntil;
    var doneLo=ui.lockoutUntil && now>=ui.lockoutUntil;
    if(doneCd||doneLo){ if(doneLo) ui.lockoutUntil=0; if(doneCd) ui.cooldownUntil=0; render(); stopGateTick(); }
    if(ui.activeTab!=='settings') stopGateTick();
  },500);
}
function stopGateTick(){ if(gateTickHandle){ clearInterval(gateTickHandle); gateTickHandle=null; } }
function renderSettingsGate(){
  var now=Date.now();
  if(ui.lockoutUntil>now){
    var s=Math.ceil((ui.lockoutUntil-now)/1000);
    return card('Locked','<h2 class="section-title">Too many wrong tries</h2><p class="muted" style="margin:0;">Try again in <strong data-lockout>'+Math.floor(s/60)+':'+pad2(s%60)+'</strong>.</p>');
  }
  var err=ui.gateError?'<div class="c-brick" style="font-size:13px;margin-bottom:10px;">'+esc(ui.gateError)+'</div>':'';
  if(!state.settings.pinHash){
    return card('First time',
      '<h2 class="section-title">Choose a PIN</h2>'+
      '<p class="muted" style="margin-top:0;font-size:13px;">This guards your XP, coin and cap settings. Pick something you won\'t type on a whim, 4 to 8 digits. If you forget it, the only way back in is a full data reset.</p>'+err+
      '<form data-form="pin-submit" class="stack"><div class="field"><label for="pin1">New PIN</label><input type="password" inputmode="numeric" autocomplete="off" id="pin1" name="pin" maxlength="8" required></div>'+
      '<div class="field"><label for="pin2">Repeat PIN</label><input type="password" inputmode="numeric" autocomplete="off" id="pin2" name="pin2" maxlength="8" required></div>'+
      '<button type="submit" class="btn btn-primary btn-block">Set PIN</button></form>');
  }
  if(!ui.settingsUnlocked){
    return card('Locked',
      '<h2 class="section-title">Enter PIN</h2>'+err+
      '<form data-form="pin-submit" class="stack"><div class="field"><input type="password" inputmode="numeric" autocomplete="off" id="pin1" name="pin" maxlength="8" aria-label="PIN" required></div>'+
      '<button type="submit" class="btn btn-primary btn-block">Unlock</button></form>');
  }
  if(ui.cooldownUntil>now){
    return card('Cooling off',
      '<h2 class="section-title">Settings open in <span data-cooldown>'+Math.ceil((ui.cooldownUntil-now)/1000)+'</span>s</h2>'+
      '<p class="muted" style="margin:0 0 12px;font-size:13px;">A short pause on purpose. If you\'re changing a limit because the day felt hard, it can probably wait.</p>'+
      '<button class="btn btn-ghost btn-block" data-action="lock-settings">Never mind</button>');
  }
  return '';
}
function appVersionNumber(){ return ((document.querySelector('meta[name="app-version"]')||{}).content)||'?'; }
function checkNativeUpdate(){
  var B=nativePlugin('WidgetBridge');
  var U=(window.__ascendUpdate||{}).url||'';
  var m=U.match(/^https:\/\/([^.\/]+)\.github\.io\/([^\/]+)\//);
  if(!B || typeof B.getAppInfo!=='function' || !m) return Promise.resolve({ status:'unsupported' });
  return B.getAppInfo().then(function(info){
    return fetch('https://api.github.com/repos/'+m[1]+'/'+m[2]+'/releases/latest',{ headers:{ Accept:'application/vnd.github+json' }, cache:'no-store' }).then(function(r){
      if(r.status===404) return { status:'norelease' };
      if(!r.ok) throw 0;
      return r.json();
    }).then(function(rel){
      if(rel.status) return rel;
      var num=parseInt((String(rel.tag_name||'').match(/(\d+)$/)||[])[1],10)||0;
      var rh=(String(rel.body||'').match(/native=([0-9a-f]{12})/)||[])[1]||null;
      var lh=(String(info.versionName||'').match(/-([0-9a-f]{12})$/)||[])[1]||null;
      var asset=(rel.assets||[]).filter(function(a){ return /\.apk$/i.test(a.name); })[0];
      var needs=num>info.versionCode && asset && (!rh || !lh || rh!==lh);
      return needs?{ status:'available', build:num, url:asset.browser_download_url }:{ status:'current', build:info.versionCode, latest:num };
    });
  });
}
function runUpdateCheck(){
  ui.upd={ busy:true, web:null, native:null, msg:null };
  render();
  var web=(window.__ascendUpdate && window.__ascendUpdate.check)?window.__ascendUpdate.check().catch(function(){ return { status:'error' }; }):Promise.resolve({ status:'unsupported' });
  var nat=checkNativeUpdate().catch(function(){ return { status:'error' }; });
  Promise.all([web,nat]).then(function(r){ ui.upd={ busy:false, web:r[0], native:r[1], msg:null }; render(); });
}
function installNativeUpdate(){
  var B=nativePlugin('WidgetBridge'), u=ui.upd||{};
  if(!B || !u.native || u.native.status!=='available') return;
  u.installing=true; u.msg='Downloading\u2026 this can take a moment.'; render();
  B.installApk({ url:u.native.url }).then(function(){
    u.msg='The installer is open. Tap Update to finish.';
  }).catch(function(e){
    var m=(e && e.message)?String(e.message):'';
    u.msg=/needs_permission/.test(m)?'Allow Ascend to install apps in the screen that just opened, come back and tap the button again.':'That did not work: '+m;
  }).then(function(){ u.installing=false; render(); });
}

function dayRuns(keys){
  var set={}; keys.forEach(function(k){ set[k]=1; });
  var days=Object.keys(set).sort(), best=0, run=0, prev=null;
  days.forEach(function(k){ if(prev && addDaysKey(prev,1)===k) run++; else run=1; if(run>best) best=run; prev=k; });
  var t=todayKey(), cur=0, k=set[t]?t:addDaysKey(t,-1);
  while(set[k]){ cur++; k=addDaysKey(k,-1); }
  return { best:best, current:cur };
}
function calModel(sel){
  var parts=String(sel||'').split(':'), kind=parts[0], id=parts.slice(1).join(':');
  if(kind==='h'){
    var h=findHabit(id); if(!h) return null;
    var done={}, frozen={};
    Object.keys(h.completions||{}).forEach(function(k){ done[k]=1; });
    (h.freezes||[]).forEach(function(k){ frozen[k]=1; });
    return { kind:'habit', id:id, name:h.name, ended:!!h.archived, done:done, frozen:frozen, counts:null, start:h.createdAt, habit:h };
  }
  var name=null, counts={};
  if(kind==='c'){
    var c=(state.challenges||[]).filter(function(x){ return x.id===id; })[0]; if(!c) return null; name=c.name;
  } else if(kind==='x'){
    (state.challengeLogs||[]).forEach(function(l){ if(l.challengeId===id) name=l.name; });
    if(name===null) return null;
  } else return null;
  (state.challengeLogs||[]).forEach(function(l){ if(l.challengeId===id) counts[l.dateKey]=(counts[l.dateKey]||0)+1; });
  var done={}; Object.keys(counts).forEach(function(k){ done[k]=1; });
  return { kind:'challenge', id:id, name:name, ended:kind==='x', done:done, frozen:{}, counts:counts, start:Object.keys(counts).sort()[0]||null };
}
function renderCalendarView(){
  var habits=(state.habits||[]).filter(function(h){ return !h.archived; });
  var chals=state.challenges||[];

  var live={}; chals.forEach(function(c){ live[c.id]=1; });
  var gone={}; (state.challengeLogs||[]).forEach(function(l){ if(!live[l.challengeId]) gone[l.challengeId]=l.name; });
  if(!calModel(ui.calSel)) ui.calSel=habits[0]?('h:'+habits[0].id):(chals[0]?('c:'+chals[0].id):null);
  var model=ui.calSel?calModel(ui.calSel):null;

  var goneIds=Object.keys(gone);
  if(endedHabits.length || goneIds.length){
    list+='<select id="cal-ended" class="cal-ended"><option value="">Ended\u2026</option>';
    endedHabits.forEach(function(h){ var id='h:'+h.id; list+='<option value="'+id+'"'+(ui.calSel===id?' selected':'')+'>'+esc(h.name)+' (habit)</option>'; });

    main='<div class="empty">Add a habit or a challenge to see it here.</div>';
  } else {
    var t=todayKey(), tp=parseDateKey(t);

    var y=ref.getFullYear(), m=ref.getMonth(), mk=y+'-'+pad2(m+1);
    var startOffset=(ref.getDay()+6)%7, daysInMonth=new Date(y,m+1,0).getDate();
    var isHabit=model.kind==='habit';
    var covered=function(k){ return !!(model.done[k]||model.frozen[k]); };
    var monthSum=0;
    if(isHabit){ Object.keys(model.done).forEach(function(k){ if(k.slice(0,7)===mk) monthSum++; }); }
    else { Object.keys(model.counts).forEach(function(k){ if(k.slice(0,7)===mk) monthSum+=model.counts[k]; }); }
    main+='<div class="cal-head"><button class="icon-btn" data-action="ccal-prev" '+(ui.calViewOffset<=-36?'disabled':'')+'>&larr;</button>'+
      '<span class="cal-title"><strong>'+MONTH_LABELS[m]+' '+y+'</strong> <span class="chip chip-gold">'+monthSum+(isHabit?(monthSum===1?' day':' days'):(monthSum===1?' time':' times'))+'</span></span>'+
      '<button class="icon-btn" data-action="ccal-next" '+(ui.calViewOffset>=0?'disabled':'')+'>&rarr;</button></div>';
    main+='<div class="cal-name">'+esc(model.name)+(model.ended?' <span class="faint">(ended)</span>':'')+'</div>';
    main+='<div class="cal-grid">';
    DOW_LABELS.forEach(function(dl){ main+='<div class="cal-dow">'+dl+'</div>'; });
    for(var i=0;i<startOffset;i++) main+='<div class="cal-cell outside"></div>';
    for(var day=1;day<=daysInMonth;day++){
      var key=mk+'-'+pad2(day), col=(startOffset+day-1)%7;
      var cls='cal-cell';
      var future=compareKeys(key,t)>0;
      var before=isHabit && model.start && compareKeys(key,model.start)<0;
      if(model.done[key]) cls+=' done'; else if(model.frozen[key]) cls+=' frozen';
      if(future||before) cls+=' future';
      if(key===t) cls+=' today-marker';
      if(covered(key)){
        if(col>0 && day>1 && covered(addDaysKey(key,-1))) cls+=' link-l';
        if(col<6 && day<daysInMonth && covered(addDaysKey(key,1))) cls+=' link-r';
      }
      var canToggle=isHabit && ui.calEdit && !future && !before;
      var n=(!isHabit && model.counts[key])||0;
      main+='<div class="'+cls+'" '+(canToggle?'data-action="toggle-habit" data-habit="'+model.id+'" data-date="'+key+'"':'')+(n?' data-d="'+day+'"':'')+'>'+(n?'<b>'+n+'</b>':day)+'</div>';
    }
    main+='</div>';
    main+='<div class="faint" style="margin-top:8px;">'+(isHabit?'Green = done \u00b7 Blue = rest day \u00b7 joined squares = a streak':'Number = times done that day \u00b7 joined squares = days in a row')+'</div>';
    if(isHabit && !model.ended) main+='<div style="margin-top:8px;"><button class="btn btn-sm'+(ui.calEdit?' btn-sage':' btn-ghost')+'" data-action="cal-edit-toggle">'+(ui.calEdit?'Done editing days':'Edit days')+'</button>'+(ui.calEdit?' <span class="faint">tap a past day to tick or untick it</span>':'')+'</div>';

    var cells=[];
    if(isHabit){
      var hb=model.habit;
      var elig=0, first=mk+'-01', last=mk+'-'+pad2(daysInMonth);
      for(var d2=1; d2<=daysInMonth; d2++){ var k2=mk+'-'+pad2(d2); if(compareKeys(k2,t)<=0 && compareKeys(k2,hb.createdAt)>=0) elig++; }
      cells=[[currentStreak(hb)+'d','Current streak'],[longestStreakEver(hb)+'d','Longest streak'],[monthSum+' / '+elig,'This month'],[Object.keys(model.done).length,'All time']];
    } else {
      var runs=dayRuns(Object.keys(model.counts));
      var activeDays=0, bestDay=0, total=0;
      Object.keys(model.counts).forEach(function(k){ total+=model.counts[k]; if(model.counts[k]>bestDay) bestDay=model.counts[k]; if(k.slice(0,7)===mk) activeDays++; });
      cells=[[monthSum,'Times this month'],[activeDays,'Active days this month'],[runs.current+'d','Days in a row'],[runs.best+'d','Best days in a row'],[bestDay,'Most in one day'],[total,'All time']];
    }

    cells.forEach(function(c){ main+='<div class="totals-cell"><div class="totals-val">'+c[0]+'</div><div class="totals-label">'+c[1]+'</div></div>'; });
    main+='</div>';
  }
  return card(null,'<div class="cal-layout">'+list+'<div class="cal-main">'+main+'</div></div>');
}
